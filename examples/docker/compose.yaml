name: standard-example

# 文档示例：部署前提供固定镜像摘要、受控秘密文件，并满足 README 中的镜像契约。
services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable repository digest}
    user: '10001:10001'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: UTC
      APP_ENV: production
      APP_DB_URL: ${APP_DB_URL:?APP_DB_URL is required without embedded credentials}
      APP_DB_USERNAME_FILE: /run/secrets/db_username
      APP_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_username
      - db_password
    ports:
      - '127.0.0.1:${API_BIND_PORT:-18080}:8080'
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - api-data:/app/data
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ['CMD', '/app/bin/healthcheck', 'ready']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable repository digest}
    user: '10001:10001'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:${WEB_BIND_PORT:-18081}:8080'
    tmpfs:
      - /tmp:size=32m,mode=1777
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ['CMD', '/app/bin/healthcheck', 'live']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  api-data:

secrets:
  db_username:
    file: ${DB_USERNAME_FILE:?DB_USERNAME_FILE is required}
  db_password:
    file: ${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}
